# ==============================================================================
# SCRAP CONNECTION APPLICATION PROPERTIES
# ==============================================================================
spring.application.name=Scrap Connection
server.port=8080

# ------------------------------------------------------------------------------
# MySQL Database Configuration
# ------------------------------------------------------------------------------
# Supports environment variables DB_URL, DB_USERNAME, DB_PASSWORD with local defaults
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/scrap_connection?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# Hibernate / JPA Settings
# ------------------------------------------------------------------------------
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=true

# ------------------------------------------------------------------------------
# Thymeleaf & MVC
# ------------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.encoding=UTF-8
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ------------------------------------------------------------------------------
# Application Custom Settings
# ------------------------------------------------------------------------------
# SMS Provider Mode: 'development' displays OTP locally in UI & console without external SMS costs
# Set to 'production' when configured with an actual SMS gateway provider
app.sms.mode=development

# OTP Rules
app.otp.expiry-minutes=5
app.otp.max-attempts=5
app.otp.rate-limit-minutes=10
app.otp.max-requests-per-window=3

# Loyalty Rewards Policy: 1 point earned per every ₹10 of completed scrap sale
app.loyalty.points-per-rupees=10

# Coupon Policy: Coupon validity in days
app.coupon.validity-days=90
