<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrap Rates Management — Scrap Connection Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="container">
            <div style="margin-bottom: 2rem;">
                <a th:href="@{/admin/dashboard}" style="font-size:0.875rem; color:var(--text-muted); font-weight:600;">← Back to Dashboard</a>
                <h1 style="font-size:2.2rem; margin-top:0.4rem;">Scrap Materials & Standard Rates</h1>
                <p style="color:var(--text-muted);">Configure standard benchmark prices per kilogram across recyclable material categories</p>
            </div>

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="card">
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Category Code</th>
                                <th>Display Name</th>
                                <th>Current Active Rate (₹ / kg)</th>
                                <th>Last Updated</th>
                                <th>Update Rate</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="p : ${materialPrices}">
                                <td>
                                    <span class="badge badge-requested" th:text="${p.category.code}">PAPER</span>
                                </td>
                                <td>
                                    <strong th:text="${p.category.displayName}">Paper & Books</strong>
                                    <div style="font-size:0.8rem; color:var(--text-muted);" th:text="${p.category.description}">Details</div>
                                </td>
                                <td>
                                    <strong style="font-size:1.25rem; color:var(--primary-dark);">
                                        ₹<span th:text="${#numbers.formatDecimal(p.pricePerKg, 1, 2)}">14.00</span>
                                    </strong>
                                </td>
                                <td style="font-size:0.85rem; color:var(--text-muted);"
                                    th:text="${#temporals.format(p.effectiveFrom, 'dd MMM yyyy')}">Date</td>
                                <td>
                                    <form th:action="@{/admin/materials/price}" method="post" style="display:flex; align-items:center; gap:0.5rem;">
                                        <input type="hidden" name="categoryId" th:value="${p.category.id}">
                                        <input type="number" step="0.5" min="0.5" name="pricePerKg" th:value="${p.pricePerKg}"
                                               class="form-control" style="width:110px; padding:0.4rem;" required>
                                        <button type="submit" class="btn btn-primary btn-sm">Save Rate</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
