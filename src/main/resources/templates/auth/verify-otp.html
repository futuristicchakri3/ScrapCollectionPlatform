<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Mobile OTP — Scrap Connection</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .auth-container {
            max-width: 480px;
            margin: 2.5rem auto;
        }
        .otp-input-field {
            font-size: 1.75rem;
            letter-spacing: 0.5rem;
            text-align: center;
            font-weight: 800;
            padding: 0.75rem;
        }
    </style>
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="container">
            <div class="auth-container">
                <div class="card" style="padding: 2.25rem;">
                    <div style="text-align: center; margin-bottom: 1.5rem;">
                        <div class="brand-icon" style="margin: 0 auto 0.75rem auto;">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <h2>Verify Mobile Number</h2>
                        <p style="color:var(--text-muted); font-size:0.9rem;">
                            Enter the 6-digit verification code for
                            <strong style="color:var(--text-main);" th:text="${mobileNumber}">+91 9876543210</strong>
                        </p>
                    </div>

                    <div th:replace="~{fragments/alerts :: alerts}"></div>

                    <form th:action="@{/verify-otp}" th:object="${otpDto}" method="post">
                        <input type="hidden" th:field="*{mobileNumber}">
                        <input type="hidden" th:field="*{purpose}">

                        <div class="form-group" style="text-align:center;">
                            <label class="form-label" for="otpInput">One-Time Password (OTP)</label>
                            <input type="text" id="otpInput" th:field="*{otp}" class="form-control otp-input-field"
                                   placeholder="••••••" maxlength="6" pattern="[0-9]{6}" required autofocus>
                            <div class="form-error" th:if="${#fields.hasErrors('otp')}" th:errors="*{otp}"></div>
                            <div class="form-text" style="margin-top:0.5rem;">Code expires in 5 minutes. Max 5 verification attempts.</div>
                        </div>

                        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" id="btnVerifySubmit">
                            Verify & Continue
                        </button>
                    </form>

                    <!-- Resend OTP Form -->
                    <div style="margin-top: 1.75rem; text-align: center; border-top: 1px solid var(--border-color); padding-top: 1.25rem;">
                        <span style="font-size:0.875rem; color:var(--text-muted);">Didn't receive the SMS code?</span>
                        <form th:action="@{/resend-otp}" method="post" style="display:inline; margin-left:0.5rem;">
                            <input type="hidden" name="mobileNumber" th:value="${mobileNumber}">
                            <input type="hidden" name="purpose" th:value="${purpose}">
                            <button type="submit" class="btn btn-outline-primary btn-sm" style="display:inline-flex;">
                                Resend Code
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
