<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 — Page Not Found | Scrap Connection</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="container" style="max-width:600px; text-align:center; padding:4rem 1rem;">
            <div style="font-size:4rem; margin-bottom:1rem;">🔍</div>
            <span class="badge badge-accepted" style="font-size:0.9rem; padding:0.4rem 1rem; margin-bottom:1rem;">Error 404</span>
            <h1 style="font-size:2.5rem; margin-bottom:1rem;" th:text="${errorTitle != null ? errorTitle : 'Page Not Found'}">Page Not Found</h1>
            <p style="color:var(--text-muted); font-size:1.05rem; margin-bottom:2rem;"
               th:text="${errorMessage != null ? errorMessage : 'The requested page, booking, or product does not exist or has been relocated.'}">
                The requested URL could not be located on this server.
            </p>
            <div style="display:flex; gap:1rem; justify-content:center;">
                <a th:href="@{/}" class="btn btn-primary">Return Home</a>
                <a th:href="@{/marketplace}" class="btn btn-secondary">Explore Marketplace</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
