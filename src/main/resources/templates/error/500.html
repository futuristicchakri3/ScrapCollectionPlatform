<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error — Scrap Connection</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="container" style="max-width:600px; text-align:center; padding:4rem 1rem;">
            <div style="font-size:4rem; margin-bottom:1rem;">⚠️</div>
            <span class="badge badge-cancelled" style="font-size:0.9rem; padding:0.4rem 1rem; margin-bottom:1rem;"
                  th:text="${errorCode != null ? 'Error ' + errorCode : 'System Error'}">Error 500</span>
            <h1 style="font-size:2.5rem; margin-bottom:1rem;" th:text="${errorTitle != null ? errorTitle : 'Application Notice'}">Application Notice</h1>
            <p style="color:var(--text-muted); font-size:1.05rem; margin-bottom:2rem;"
               th:text="${errorMessage != null ? errorMessage : 'An unexpected exception occurred while processing your request. Please try again or return home.'}">
                An issue occurred while processing your request.
            </p>
            <div style="display:flex; gap:1rem; justify-content:center;">
                <a th:href="@{/}" class="btn btn-primary">Return to Homepage</a>
                <a href="javascript:history.back()" class="btn btn-secondary">Go Back</a>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
