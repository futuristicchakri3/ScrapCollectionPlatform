<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
<nav class="navbar" th:fragment="navbar">
    <div class="container nav-container">
        <a th:href="@{/}" class="brand-logo">
            <div class="brand-icon">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 19H4.815a1.83 1.83 0 0 1-1.57-.881 1.785 1.785 0 0 1-.004-1.784L7.196 9.5"/>
                    <path d="M11 19h8.2a1.8 1.8 0 0 0 1.6-1 1.8 1.8 0 0 0 0-1.8L16.5 8"/>
                    <path d="m14 4-2-2-2 2"/>
                    <path d="M12 2v8"/>
                    <path d="m3 14 3-2 3 2"/>
                    <path d="m21 14-3-2-3 2"/>
                </svg>
            </div>
            <span>Scrap Connection</span>
        </a>

        <ul class="nav-menu" id="navMenu">
            <li><a th:href="@{/}" class="nav-link">Home</a></li>
            <li><a th:href="@{/about}" class="nav-link">About & Rates</a></li>
            <li><a th:href="@{/marketplace}" class="nav-link">Recycled Marketplace</a></li>

            <!-- Customer Links -->
            <li sec:authorize="hasRole('CUSTOMER')">
                <a th:href="@{/customer/dashboard}" class="nav-link">Customer Dashboard</a>
            </li>
            <li sec:authorize="hasRole('CUSTOMER')">
                <a th:href="@{/customer/book-scrap}" class="nav-link">Book Pickup</a>
            </li>
            <li sec:authorize="hasRole('CUSTOMER')">
                <a th:href="@{/customer/coupons}" class="nav-link">Coupon Wallet</a>
            </li>

            <!-- Shopkeeper Links -->
            <li sec:authorize="hasRole('SHOPKEEPER')">
                <a th:href="@{/shopkeeper/dashboard}" class="nav-link">Shop Dashboard</a>
            </li>
            <li sec:authorize="hasRole('SHOPKEEPER')">
                <a th:href="@{/shopkeeper/requests}" class="nav-link">Available Pickups</a>
            </li>
            <li sec:authorize="hasRole('SHOPKEEPER')">
                <a th:href="@{/shopkeeper/pickups}" class="nav-link">My Pickups</a>
            </li>

            <!-- Admin Links -->
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/dashboard}" class="nav-link">Admin Portal</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/shopkeepers}" class="nav-link">Approvals</a>
            </li>
            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/materials}" class="nav-link">Scrap Rates</a>
            </li>
        </ul>

        <div class="nav-actions">
            <!-- Customer Cart Button -->
            <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/marketplace/cart}" class="btn btn-outline-primary btn-sm" title="Marketplace Cart">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="9" cy="21" r="1"></circle>
                    <circle cx="20" cy="21" r="1"></circle>
                    <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                </svg>
                <span>Cart</span>
            </a>

            <!-- Unauthenticated -->
            <div sec:authorize="!isAuthenticated()" style="display:flex; gap:0.5rem;">
                <a th:href="@{/login}" class="btn btn-secondary btn-sm">Login</a>
                <a th:href="@{/register/customer}" class="btn btn-primary btn-sm">Sell Scrap</a>
            </div>

            <!-- Authenticated User Menu & Logout -->
            <div sec:authorize="isAuthenticated()" style="display:flex; align-items:center; gap:0.75rem;">
                <span style="font-size:0.875rem; font-weight:600; color:var(--text-muted);" sec:authentication="name">User</span>
                <form th:action="@{/logout}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-secondary btn-sm" style="color:var(--danger);">Logout</button>
                </form>
            </div>
        </div>
    </div>
</nav>
</body>
</html>
