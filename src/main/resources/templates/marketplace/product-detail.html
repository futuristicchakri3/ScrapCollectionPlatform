<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${product.name + ' — Scrap Connection Marketplace'}">Product Detail</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="container">
            <div style="margin-bottom: 2rem;">
                <a th:href="@{/marketplace}" style="font-size:0.875rem; color:var(--text-muted); font-weight:600;">← Back to Marketplace</a>
            </div>

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="card" style="padding: 2.5rem;">
                <div class="grid grid-cols-2" style="gap:3rem; align-items:center;">
                    <!-- Image Box -->
                    <div style="height:360px; background:linear-gradient(135deg, #f1f5f9, #e2e8f0); border-radius:var(--radius-lg); display:flex; align-items:center; justify-content:center; font-size:6rem;">
                        <span th:if="${product.category == 'Stationery'}">📚</span>
                        <span th:if="${product.category == 'Fashion'}">👜</span>
                        <span th:if="${product.category == 'Home & Garden'}">🪴</span>
                        <span th:if="${product.category == 'Home Decor'}">🕰️</span>
                        <span th:if="${product.category == 'Kitchenware'}">🍽️</span>
                        <span th:if="${product.category != 'Stationery' and product.category != 'Fashion' and product.category != 'Home & Garden' and product.category != 'Home Decor' and product.category != 'Kitchenware'}">🌱</span>
                    </div>

                    <!-- Details -->
                    <div>
                        <span class="product-category" th:text="${product.category}">Category</span>
                        <h1 style="font-size:2.2rem; margin-top:0.25rem; margin-bottom:1rem;" th:text="${product.name}">Product Name</h1>

                        <div style="font-size:2rem; font-weight:800; color:var(--primary-dark); margin-bottom:1rem;">
                            ₹<span th:text="${#numbers.formatDecimal(product.price, 1, 2)}">199.00</span>
                        </div>

                        <div style="margin-bottom:1.5rem;">
                            <span th:if="${product.availableStock > 0}" class="badge badge-completed">
                                In Stock (<span th:text="${product.availableStock}">10</span> units available)
                            </span>
                            <span th:if="${product.availableStock <= 0}" class="badge badge-cancelled">Sold Out</span>
                        </div>

                        <p style="color:var(--text-muted); font-size:1rem; line-height:1.7; margin-bottom:2rem;" th:text="${product.description}">
                            Product full description text.
                        </p>

                        <!-- Add to Cart Form for Customer -->
                        <form sec:authorize="hasRole('CUSTOMER')" th:action="@{/marketplace/cart/add}" method="post" style="display:flex; gap:1rem; align-items:center;">
                            <input type="hidden" name="productId" th:value="${product.id}">
                            <div style="width:110px;">
                                <label class="form-label" style="font-size:0.8rem;">Quantity</label>
                                <input type="number" name="quantity" value="1" min="1" th:max="${product.availableStock}" class="form-control" required>
                            </div>
                            <div style="flex:1; margin-top:1.4rem;">
                                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;" th:disabled="${product.availableStock <= 0}">
                                    🛒 Add to Cart
                                </button>
                            </div>
                        </form>

                        <div sec:authorize="!hasRole('CUSTOMER')" style="margin-top:1.5rem; background:#f8fafc; border:1px solid var(--border-color); border-radius:var(--radius-md); padding:1rem;">
                            <span style="font-size:0.9rem; color:var(--text-muted);">
                                Please <a th:href="@{/login}" style="font-weight:700; color:var(--primary);">log in as a customer</a> to purchase recycled products using your cash, UPI, or scrap coupon wallet balance.
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
