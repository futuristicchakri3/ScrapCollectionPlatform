<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Profile & Addresses — Scrap Connection</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main class="main-content">
        <div class="container">
            <div style="margin-bottom: 2rem;">
                <a th:href="@{/customer/dashboard}" style="font-size:0.875rem; color:var(--text-muted); font-weight:600;">← Back to Dashboard</a>
                <h1 style="font-size:2.2rem; margin-top:0.4rem;">Customer Account & Addresses</h1>
            </div>

            <div th:replace="~{fragments/alerts :: alerts}"></div>

            <div class="grid grid-cols-3" style="gap:1.5rem;">
                <!-- Profile Overview -->
                <div class="card">
                    <h3 class="card-title" style="margin-bottom:1rem;">Profile Overview</h3>
                    <div style="margin-bottom:1rem;">
                        <span style="font-size:0.8rem; color:var(--text-muted); display:block;">Full Name</span>
                        <strong th:text="${customer.fullName}">Name</strong>
                    </div>
                    <div style="margin-bottom:1rem;">
                        <span style="font-size:0.8rem; color:var(--text-muted); display:block;">Registered Mobile Number</span>
                        <strong th:text="${customer.user.mobileNumber}">9876543210</strong>
                    </div>
                    <div style="margin-bottom:1rem;">
                        <span style="font-size:0.8rem; color:var(--text-muted); display:block;">Email</span>
                        <span th:text="${customer.email != null ? customer.email : 'Not Provided'}">Email</span>
                    </div>
                    <div style="margin-bottom:1rem;">
                        <span style="font-size:0.8rem; color:var(--text-muted); display:block;">Default Locality</span>
                        <strong th:text="${customer.defaultLocality}">Locality</strong>
                    </div>
                    <div>
                        <span style="font-size:0.8rem; color:var(--text-muted); display:block;">Account Status</span>
                        <span class="badge badge-active">Active & Verified</span>
                    </div>
                </div>

                <!-- Saved Addresses & Add Address Form -->
                <div style="grid-column: span 2;">
                    <!-- Saved Addresses List -->
                    <div class="card" style="margin-bottom:1.5rem;">
                        <h3 class="card-title" style="margin-bottom:1rem;">Saved Pickup Addresses</h3>
                        <div class="grid grid-cols-2" style="gap:1rem;">
                            <div th:each="addr : ${addresses}" style="border:1px solid var(--border-color); border-radius:var(--radius-md); padding:1rem; background:#f8fafc;">
                                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
                                    <strong style="color:var(--primary-dark);" th:text="${addr.title}">Home</strong>
                                    <span th:if="${addr.isDefault}" class="badge badge-accepted" style="font-size:0.7rem;">Default</span>
                                </div>
                                <div style="font-size:0.875rem;" th:text="${addr.streetAddress}">Street</div>
                                <div style="font-size:0.8rem; color:var(--text-muted);" th:text="${addr.locality + ', ' + addr.city + ' - ' + addr.postalCode}">Locality, PIN</div>
                            </div>
                        </div>
                    </div>

                    <!-- Add New Address Form -->
                    <div class="card">
                        <h3 class="card-title" style="margin-bottom:1rem;">Add New Address</h3>
                        <form th:action="@{/customer/address}" th:object="${addressDto}" method="post">
                            <div class="grid grid-cols-2">
                                <div class="form-group">
                                    <label class="form-label" for="addrTitle">Address Title (e.g. Home, Office) *</label>
                                    <input type="text" id="addrTitle" th:field="*{title}" class="form-control" placeholder="Home" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="addrContact">Contact Number</label>
                                    <input type="tel" id="addrContact" th:field="*{contactNumber}" class="form-control" placeholder="10-digit mobile">
                                </div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="addrStreet">Street Address *</label>
                                <textarea id="addrStreet" th:field="*{streetAddress}" class="form-control" rows="2" placeholder="House/Flat number, building, street" required></textarea>
                            </div>

                            <div class="grid grid-cols-3">
                                <div class="form-group">
                                    <label class="form-label" for="addrLocality">Locality *</label>
                                    <input type="text" id="addrLocality" th:field="*{locality}" class="form-control" placeholder="Madhapur" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="addrCity">City *</label>
                                    <input type="text" id="addrCity" th:field="*{city}" class="form-control" placeholder="Hyderabad" required>
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="addrPin">PIN Code *</label>
                                    <input type="text" id="addrPin" th:field="*{postalCode}" class="form-control" placeholder="500081" required>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-primary btn-sm">Save Address</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
