# Test Configuration using in-memory H2 with MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:scrap_test;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

app.sms.mode=development
app.loyalty.points-per-rupees=10
app.coupon.validity-days=90
